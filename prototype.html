<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Zoe — Rigged Vector Character</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#100a20;
    --panel:#1c1432;
    --panel-2:#251a43;
    --line:rgba(255,255,255,.12);
    --muted:#b7accd;
    --text:#fff;
    --accent:#a95cff;
    --accent-2:#2ed8ef;
    --pink:#ff4eb3;
    --good:#72ed95;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
    radial-gradient(circle at 18% 6%,rgba(169,92,255,.2),transparent 34%),
    radial-gradient(circle at 88% 88%,rgba(46,216,239,.12),transparent 32%),var(--bg);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow-x:hidden}
  button,input,select{font:inherit}
  .app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
  header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(16,10,32,.74);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
  .brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--accent));display:grid;place-items:center;box-shadow:0 10px 28px rgba(169,92,255,.35)}
  .logo svg{width:24px}.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:var(--muted)}
  .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(114,237,149,.12)}
  main{display:grid;grid-template-columns:minmax(420px,1fr) 380px;min-height:0}
  .stage-wrap{padding:20px;min-height:700px;display:grid;place-items:center;position:relative}
  .stage-card{width:min(100%,760px);height:min(calc(100vh - 112px),900px);min-height:620px;border:1px solid var(--line);border-radius:30px;position:relative;overflow:hidden;background:
    radial-gradient(circle at 50% 34%,rgba(242,97,218,.16),transparent 38%),
    linear-gradient(150deg,#251342,#151029 62%,#111323);box-shadow:0 28px 70px rgba(0,0,0,.36)}
  .stage-card.checker::before{content:"";position:absolute;inset:0;background-color:#f7f4fb;background-image:linear-gradient(45deg,#e8e0ee 25%,transparent 25%),linear-gradient(-45deg,#e8e0ee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e0ee 75%),linear-gradient(-45deg,transparent 75%,#e8e0ee 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0;opacity:.97}
  .stage-glow{position:absolute;inset:7% 12% 8%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,80,188,.22),transparent 68%);filter:blur(12px);pointer-events:none}
  .svg-stage{position:absolute;inset:0;display:grid;place-items:center;padding:16px}.svg-stage>svg{height:100%;width:100%;max-height:100%;filter:drop-shadow(0 18px 12px rgba(26,6,43,.2));overflow:visible}
  .stage-label{position:absolute;left:18px;top:18px;padding:9px 12px;border-radius:12px;background:rgba(16,10,32,.72);border:1px solid var(--line);font-size:12px;color:#e7ddf7;backdrop-filter:blur(10px)}
  .stage-help{position:absolute;right:18px;bottom:18px;padding:9px 12px;border-radius:12px;background:rgba(16,10,32,.72);border:1px solid var(--line);font-size:11px;color:var(--muted);backdrop-filter:blur(10px)}
  aside{border-left:1px solid var(--line);background:rgba(24,16,44,.84);backdrop-filter:blur(16px);overflow:auto;padding:18px;max-height:calc(100vh - 70px)}
  .section{padding:16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018));margin-bottom:14px}
  .section h2{font-size:13px;margin:0 0 12px;letter-spacing:.02em}.section-sub{font-size:11px;color:var(--muted);margin:-4px 0 12px;line-height:1.45}
  .animation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:1px solid var(--line);background:#2a1e47;color:#fff;padding:11px 12px;border-radius:13px;cursor:pointer;transition:.18s ease;min-height:43px;font-weight:700;font-size:12px}.btn:hover{transform:translateY(-1px);border-color:rgba(169,92,255,.65);background:#342456}.btn.active{background:linear-gradient(135deg,var(--accent),var(--pink));border-color:transparent;box-shadow:0 9px 24px rgba(169,92,255,.24)}
  .btn.secondary{background:rgba(255,255,255,.045);font-weight:650}.btn.export{background:linear-gradient(135deg,#246ff5,#6d4df4);border:0}.btn.export.alt{background:linear-gradient(135deg,#db3a9d,#8d48ef)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row+.row{margin-top:10px}.label{font-size:12px;color:#e8e0f5}.value{font-size:11px;color:var(--accent-2);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
  input[type="range"]{width:100%;accent-color:var(--accent);height:18px}.joint{display:grid;grid-template-columns:88px 1fr 38px;gap:8px;align-items:center;margin:7px 0}.joint .label{font-size:11px;color:var(--muted)}
  select{background:#211735;border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 10px;outline:none}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg .btn{min-height:36px;padding:8px 5px;font-size:10px}
  .toggle{position:relative;width:42px;height:24px}.toggle input{opacity:0;width:0;height:0}.toggle span{position:absolute;inset:0;border-radius:999px;background:#46385e;cursor:pointer;transition:.2s}.toggle span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.toggle input:checked+span{background:linear-gradient(90deg,var(--accent),var(--pink))}.toggle input:checked+span::after{transform:translateX(18px)}
  .export-grid{display:grid;gap:8px}.mini{font-size:10px;color:var(--muted);line-height:1.45;margin-top:9px}.progress{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px;display:none}.progress.show{display:block}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--pink));transition:width .12s}
  .footer-note{font-size:10px;color:#817699;padding:4px 4px 14px;text-align:center}
  @media(max-width:920px){main{grid-template-columns:1fr}.stage-wrap{min-height:650px;padding:12px}.stage-card{height:72vh;min-height:600px}aside{border-left:0;border-top:1px solid var(--line);max-height:none}.status{display:none}}
  @media(max-width:520px){header{padding:0 14px}.brand p{display:none}.stage-card{height:68vh;min-height:540px;border-radius:22px}.stage-wrap{min-height:570px}.svg-stage{padding:8px}aside{padding:12px}.joint{grid-template-columns:76px 1fr 34px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" fill="none" stroke="white" stroke-width="2"/><path d="m10 8 6 4-6 4Z" fill="white"/></svg></div>
    <div><h1>Zoe — Rigged Vector Character</h1><p>Layered SVG · bone hierarchy · lip sync · sprite export</p></div>
  </div>
  <div class="status"><span class="dot"></span><span id="statusText">Rig ready</span></div>
</header>
<main>
  <section class="stage-wrap">
    <div class="stage-card" id="stageCard">
      <div class="stage-glow"></div>
      <div class="stage-label"><strong id="animationLabel">Idle</strong> · SVG rig preview</div>
      <div class="svg-stage"><svg id="zoe-character" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Zoe rigged vector character</title>
  <desc id="desc">A layered SVG character with named transform groups for the root, torso, head, arms, legs, hands, eyes and mouths.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd2ac"/>
      <stop offset="0.55" stop-color="#eda374"/>
      <stop offset="1" stop-color="#d98355"/>
    </linearGradient>
    <linearGradient id="skinSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9b9"/>
      <stop offset="1" stop-color="#e99a6b"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f2b13"/>
      <stop offset="0.45" stop-color="#3f160d"/>
      <stop offset="1" stop-color="#210a08"/>
    </linearGradient>
    <linearGradient id="hairGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b95c25"/>
      <stop offset="0.42" stop-color="#6c2813"/>
      <stop offset="1" stop-color="#2a0c08"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4eef9"/>
      <stop offset="1" stop-color="#d8cce6"/>
    </linearGradient>
    <linearGradient id="hoodieShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0fa"/>
      <stop offset="1" stop-color="#c9b9d8"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d23cbd"/>
      <stop offset="0.42" stop-color="#982eaa"/>
      <stop offset="1" stop-color="#5b247f"/>
    </linearGradient>
    <linearGradient id="pantsDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e2da8"/>
      <stop offset="1" stop-color="#4d1f70"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f4edf8"/>
      <stop offset="1" stop-color="#d7c8df"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6dc8"/>
      <stop offset="1" stop-color="#d92c91"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69e9e5"/>
      <stop offset="1" stop-color="#1da9c1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff77a"/>
      <stop offset="0.5" stop-color="#ffc62f"/>
      <stop offset="1" stop-color="#e47c14"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2d0d4c" flood-opacity="0.23"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2d0d4c" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Hand symbols are rooted at the wrist at 0,0 and extend downwards. -->
    <g id="hand-open-shape">
      <path d="M-21 9 C-25 22 -23 43 -11 58 C-3 68 10 68 18 59 C25 51 26 39 22 27 L16 8 C14 1 6 2 7 10 L9 24 L5 4 C4 -3 -5 -2 -4 6 L-2 24 L-8 5 C-10 -2 -18 0 -15 8 L-10 27 L-16 13 C-20 6 -26 11 -21 21 Z" fill="url(#skinSoft)" stroke="#a65539" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-12 38 C-4 33 7 33 17 38" fill="none" stroke="#cc7955" stroke-width="2" stroke-linecap="round" opacity=".55"/>
      <path d="M-5 11 L-2 24 M4 9 L8 24 M13 12 L16 28" fill="none" stroke="#cf7b56" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
    </g>
    <g id="hand-fist-shape">
      <path d="M-24 18 C-25 5 -13 -2 -4 5 C5 -2 18 2 20 13 L24 34 C26 50 17 63 1 65 C-14 67 -25 57 -25 42 Z" fill="url(#skinSoft)" stroke="#a65539" stroke-width="3"/>
      <path d="M-18 19 C-8 13 4 13 17 18 M-17 31 C-6 27 7 27 19 31 M-9 15 L-8 31 M2 14 L3 31 M12 16 L13 31" fill="none" stroke="#c77452" stroke-width="2" stroke-linecap="round" opacity=".65"/>
      <path d="M-22 37 C-12 31 -5 34 0 43" fill="none" stroke="#c77452" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="hand-point-shape">
      <path d="M-19 18 C-20 7 -10 1 -2 7 L3 18 L25 -11 C30 -17 39 -10 35 -4 L17 27 C24 37 23 50 14 59 C4 69 -12 66 -20 55 C-27 45 -25 30 -19 18 Z" fill="url(#skinSoft)" stroke="#a65539" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-15 31 C-6 27 5 29 14 35" fill="none" stroke="#c77452" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    </g>
    <g id="hand-peace-shape">
      <path d="M-23 21 C-26 10 -16 4 -8 11 L-3 22 L-7 -17 C-8 -25 2 -27 4 -18 L8 10 L14 -14 C16 -23 27 -20 25 -11 L20 19 C27 28 27 44 17 56 C8 68 -9 68 -19 57 C-28 48 -29 33 -23 21 Z" fill="url(#skinSoft)" stroke="#a65539" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-18 35 C-8 30 5 31 16 37" fill="none" stroke="#c77452" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    </g>

    <g id="star-clip">
      <path d="M0 -13 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z" fill="#b8ff2c" stroke="#538900" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    .outline { stroke:#4e214b; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    .detail { fill:none; stroke:#704068; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .bone-guide { display:none; pointer-events:none; }
    .bone-guide line { stroke:#32d8ff; stroke-width:5; stroke-linecap:round; filter:url(#glow); }
    .bone-guide circle { fill:#fff; stroke:#7b2cff; stroke-width:5; filter:url(#glow); }
    .bone-guide .joint-end { fill:#7b2cff; stroke:#fff; }
    #zoe-character.show-rig .bone-guide { display:inline; }
    .face-layer, .hand-layer { display:none; }
    .face-layer.active, .hand-layer.active { display:inline; }
  </style>

  <!-- Ground shadow stays separate so root bounce does not move it. -->
  <ellipse id="ground-shadow" cx="400" cy="963" rx="150" ry="25" fill="#2b1047" opacity=".22"/>

  <g id="root-position" transform="translate(400 620)">
    <g id="bone-root" transform="translate(0 0) rotate(0)">

      <!-- Legs are behind the torso. Every rotate group is a usable bone. -->
      <g id="leg-left-position" transform="translate(-48 38)">
        <g id="bone-leg-left-upper" transform="rotate(0)">
          <path d="M-39 -5 C-46 37 -44 99 -34 146 C-15 157 15 157 34 146 C43 94 45 37 38 -5 C15 -17 -16 -17 -39 -5 Z" fill="url(#pants)" class="outline"/>
          <path d="M-31 22 C-12 15 12 15 31 22" class="detail" opacity=".55"/>
          <rect x="-45" y="45" width="48" height="54" rx="12" fill="#842987" stroke="#4e214b" stroke-width="3" transform="rotate(4 -21 72)"/>
          <path d="M-36 55 H-8" stroke="#e169d1" stroke-width="3" stroke-linecap="round"/>
          <g transform="translate(-20 75)">
            <circle r="15" fill="#ffd928" stroke="#8b5610" stroke-width="3"/>
            <circle cx="-5" cy="-3" r="2.4" fill="#4b2c13"/>
            <circle cx="5" cy="-3" r="2.4" fill="#4b2c13"/>
            <path d="M-7 4 Q0 10 7 4" fill="none" stroke="#4b2c13" stroke-width="2.5" stroke-linecap="round"/>
          </g>
          <path d="M19 4 C4 14 -10 15 -28 8" fill="none" stroke="#f180df" stroke-width="3" opacity=".45"/>
          <g id="leg-left-lower-position" transform="translate(0 145)">
            <g id="bone-leg-left-lower" transform="rotate(0)">
              <path d="M-34 -4 C-37 35 -35 102 -28 143 C-11 153 12 153 29 143 C35 98 37 39 33 -4 C15 -14 -15 -14 -34 -4 Z" fill="url(#pantsDark)" class="outline"/>
              <path d="M-25 25 C-8 19 10 19 26 25 M-24 102 C-7 108 8 108 25 102" class="detail" opacity=".38"/>
              <path d="M-27 139 Q0 151 27 139" fill="none" stroke="#e058ca" stroke-width="5"/>
              <g id="foot-left-position" transform="translate(0 138)">
                <g id="bone-foot-left" transform="rotate(0)">
                  <path d="M-31 -6 C-34 14 -44 38 -55 50 C-63 61 -58 75 -43 78 L38 78 C55 77 61 66 54 55 C44 42 27 32 22 -4 C6 -14 -15 -14 -31 -6 Z" fill="url(#shoe)" class="outline"/>
                  <path d="M-47 55 C-13 64 21 62 50 53" fill="none" stroke="#ff4eae" stroke-width="9" stroke-linecap="round"/>
                  <path d="M-25 2 L13 38 L27 7" fill="url(#teal)" stroke="#178ea7" stroke-width="3" stroke-linejoin="round"/>
                  <path d="M-16 15 L15 15 M-11 25 L20 25 M-4 35 L25 35" stroke="#e13c9e" stroke-width="3" stroke-linecap="round"/>
                  <rect x="-18" y="-9" width="36" height="18" rx="8" fill="#62dbe3" stroke="#178ea7" stroke-width="3"/>
                  <g class="bone-guide"><circle r="8"/><line x1="0" y1="0" x2="0" y2="55"/><circle class="joint-end" cy="55" r="6"/></g>
                </g>
              </g>
              <g class="bone-guide"><circle r="8"/><line x1="0" y1="0" x2="0" y2="138"/><circle class="joint-end" cy="138" r="6"/></g>
            </g>
          </g>
          <g class="bone-guide"><circle r="8"/><line x1="0" y1="0" x2="0" y2="145"/><circle class="joint-end" cy="145" r="6"/></g>
        </g>
      </g>

      <g id="leg-right-position" transform="translate(48 38)">
        <g id="bone-leg-right-upper" transform="rotate(0)">
          <path d="M-38 -5 C-45 37 -43 94 -34 146 C-15 157 15 157 34 146 C44 99 46 37 39 -5 C16 -17 -15 -17 -38 -5 Z" fill="url(#pants)" class="outline"/>
          <path d="M-30 22 C-12 15 12 15 31 22" class="detail" opacity=".55"/>
          <rect x="4" y="46" width="44" height="60" rx="12" fill="#842987" stroke="#4e214b" stroke-width="3" transform="rotate(-3 26 76)"/>
          <path d="M11 57 H39" stroke="#e169d1" stroke-width="3" stroke-linecap="round"/>
          <path d="M-18 4 C-4 14 11 15 28 8" fill="none" stroke="#f180df" stroke-width="3" opacity=".45"/>
          <g id="leg-right-lower-position" transform="translate(0 145)">
            <g id="bone-leg-right-lower" transform="rotate(0)">
              <path d="M-33 -4 C-37 39 -35 98 -29 143 C-12 153 11 153 28 143 C35 102 37 35 34 -4 C15 -14 -15 -14 -33 -4 Z" fill="url(#pantsDark)" class="outline"/>
              <path d="M-25 25 C-8 19 10 19 26 25 M-24 102 C-7 108 8 108 25 102" class="detail" opacity=".38"/>
              <path d="M-27 139 Q0 151 27 139" fill="none" stroke="#e058ca" stroke-width="5"/>
              <g id="foot-right-position" transform="translate(0 138)">
                <g id="bone-foot-right" transform="rotate(0)">
                  <path d="M-22 -4 C-27 32 -44 42 -54 55 C-61 66 -55 77 -38 78 L43 78 C58 75 63 61 55 50 C44 38 34 14 31 -6 C15 -14 -6 -14 -22 -4 Z" fill="url(#shoe)" class="outline"/>
                  <path d="M-49 53 C-20 62 14 64 48 55" fill="none" stroke="#ff4eae" stroke-width="9" stroke-linecap="round"/>
                  <path d="M-27 7 L-13 38 L25 2" fill="url(#teal)" stroke="#178ea7" stroke-width="3" stroke-linejoin="round"/>
                  <path d="M-25 15 L6 15 M-20 25 L11 25 M-15 35 L14 35" stroke="#e13c9e" stroke-width="3" stroke-linecap="round"/>
                  <rect x="-18" y="-9" width="36" height="18" rx="8" fill="#62dbe3" stroke="#178ea7" stroke-width="3"/>
                  <g class="bone-guide"><circle r="8"/><line x1="0" y1="0" x2="0" y2="55"/><circle class="joint-end" cy="55" r="6"/></g>
                </g>
              </g>
              <g class="bone-guide"><circle r="8"/><line x1="0" y1="0" x2="0" y2="138"/><circle class="joint-end" cy="138" r="6"/></g>
            </g>
          </g>
          <g class="bone-guide"><circle r="8"/><line x1="0" y1="0" x2="0" y2="145"/><circle class="joint-end" cy="145" r="6"/></g>
        </g>
      </g>

      <!-- Left arm is drawn behind the torso. -->
      <g id="torso-position" transform="translate(0 0)">
        <g id="bone-torso" transform="rotate(0)">
          <g id="arm-left-position" transform="translate(-103 -218)">
            <g id="bone-arm-left-upper" transform="rotate(10)">
              <path d="M-26 -5 C-42 15 -44 55 -35 91 C-29 114 -17 130 0 132 C18 129 30 112 35 89 C43 52 40 1
